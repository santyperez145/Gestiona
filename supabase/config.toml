project_id = "hummeopatkniwkyrrhwc"

[auth]
site_url = "https://nerqia.app"
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"
additional_redirect_urls = [
  "https://nerqia.app/**",
  "https://www.nerqia.app/**",
  "https://*.nerqia.app/**",
  "https://nerqia-*-santyperez145sgmailcoms-projects.vercel.app/**",
  "https://exentryimports.vercel.app/**",
  "https://exentryimports-*-santyperez145sgmailcoms-projects.vercel.app/**",
  "http://localhost:8080/**",
  "http://127.0.0.1:8080/**",
  "http://127.0.0.1:4178/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

# Esta plantilla rige el entorno local/self-hosted. En el proyecto Supabase
# alojado se publica mediante Authentication > Email Templates o Management API.
[auth.email.template.confirmation]
subject = "Confirmá tu correo · Nerqia"
content_path = "./supabase/templates/confirmation.html"

[storage.vector]
enabled = false

[functions.auto-recurring-expenses]
verify_jwt = true

[functions.weekly-backup]
verify_jwt = true

[functions.extract-receipt]
verify_jwt = true

[functions.search-product-images]
verify_jwt = true

# Storefront público: la capacidad opaca del pedido se valida dentro de la
# función. Activar verify_jwt acá bloquearía a compradores anónimos legítimos.
[functions.store-order-email]
verify_jwt = false

# Operación del comercio: además del permiso ecommerce.edit, exige usuario real.
[functions.store-order-status-email]
verify_jwt = true

# Consulta publica de cuotas: resuelve el comercio por slug sin exponer claves.
[functions.mp-installments]
verify_jwt = false

# Operación del comercio y proveedor pago: exige JWT de usuario y owner/admin.
[functions.store-domain]
verify_jwt = true

# Baja publica con token opaco, sin sesion de usuario.
[functions.email-campaign-unsubscribe]
verify_jwt = false

# El cron usa secreto propio; el envio manual verifica el usuario dentro de la funcion.
[functions.send-email-campaign]
verify_jwt = false

# Valida la firma contra Auth y la sesión en SQL; sólo transporte del proxy.
[functions.trusted-device]
verify_jwt = false

# Cron schedules — run via pg_cron or Supabase Dashboard > Edge Functions > Schedules
# auto-recurring-expenses: "0 3 1 * *"   (1st of each month at 3 AM UTC)
# weekly-backup: "30 3 * * 0" (domingos 03:30 UTC), sólo si existe
# BACKUP_CRON_SECRET tanto en Vault como en Edge Functions. D8a crea snapshots
# con integridad verificable; el restore destructivo sigue bloqueado por drill.

# Cron cada 10 minutos (20260925011000): la autenticación es x-cron-secret
# dentro de la función (exigirCron); el código se recuperó de la versión
# desplegada el 2026-10-09 porque nunca había entrado al repo.
[functions.reconcile-store-refunds]
verify_jwt = false
