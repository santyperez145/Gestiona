[auth]
site_url = "https://nerqia.app"
additional_redirect_urls = [
  "https://nerqia.app/**",
  "https://www.nerqia.app/**",
  "https://*.nerqia.app/**",
  "https://nerqia-*-santyperez145sgmailcoms-projects.vercel.app/**",
  "https://exentryimports.vercel.app/**",
  "https://exentryimports-*-santyperez145sgmailcoms-projects.vercel.app/**",
  "http://localhost:8080/**",
  "http://127.0.0.1:8080/**",
  "http://127.0.0.1:4178/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[storage.vector]
enabled = false

[functions.auto-recurring-expenses]
verify_jwt = true

[functions.weekly-backup]
verify_jwt = true

[functions.extract-receipt]
verify_jwt = true

# Storefront público: la capacidad opaca del pedido se valida dentro de la
# función. Activar verify_jwt acá bloquearía a compradores anónimos legítimos.
[functions.store-order-email]
verify_jwt = false

# Operación del comercio: además del permiso ecommerce.edit, exige usuario real.
[functions.store-order-status-email]
verify_jwt = true

# Cron schedules — run via pg_cron or Supabase Dashboard > Edge Functions > Schedules
# auto-recurring-expenses: "0 3 1 * *"   (1st of each month at 3 AM UTC)
# weekly-backup: "30 3 * * 0" (domingos 03:30 UTC), sólo si existe
# BACKUP_CRON_SECRET tanto en Vault como en Edge Functions. D8a crea snapshots
# con integridad verificable; el restore destructivo sigue bloqueado por drill.
