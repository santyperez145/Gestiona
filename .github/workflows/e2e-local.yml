name: E2E contra una base local

# El E2E crítico (ci.yml) corre contra producción. Este corre panel, tienda y circuito contra
# un Supabase local reconstruido desde cero y sembrado: prueba el código
# aunque producción esté caída, y permite circuitos que escriben datos.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-local
  cancel-in-progress: true

jobs:
  e2e-local:
    name: Panel contra Supabase local
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIMULACRO_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_LOCAL_URL: http://127.0.0.1:54321
      # Las imágenes de Supabase desde ghcr.io: el registro por defecto
      # (public.ecr.aws) corta con «Data limit exceeded» y el CLI recién
      # después recae en ghcr.io (visto en cada simulacro del 2026-10-31).
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Supabase local vacío
        run: |
          mkdir -p "$RUNNER_TEMP/vacio/supabase"
          cp supabase/config.toml "$RUNNER_TEMP/vacio/supabase/"
          cp -r supabase/templates "$RUNNER_TEMP/vacio/supabase/"
          # Las funciones del repo, para que la app no reciba 503 al llamarlas.
          cp -r supabase/functions "$RUNNER_TEMP/vacio/supabase/"
          # Mailpit queda: el E2E del alta lee el mail de confirmación.
          npx supabase start --workdir "$RUNNER_TEMP/vacio" -x studio,imgproxy,logflare,vector,supavisor
          npx supabase status --workdir "$RUNNER_TEMP/vacio" -o env > "$RUNNER_TEMP/supabase.env"
          # Las claves locales son públicas y fijas, pero igual no se imprimen.
          anon=$(grep -E '^(ANON_KEY|PUBLISHABLE_KEY)=' "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | tr -d '"')
          service=$(grep -E '^(SERVICE_ROLE_KEY|SECRET_KEY)=' "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | tr -d '"')
          echo "::add-mask::$service"
          echo "VITE_SUPABASE_URL=$SUPABASE_LOCAL_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$anon" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$service" >> "$GITHUB_ENV"

      # La descarga de la imagen se cortó una vez («connection reset by peer»):
      # lo pasajero se reintenta en vez de voltear la corrida.
      - name: Imagen de Playwright
        run: |
          for intento in 1 2 3 4 5; do
            docker pull -q mcr.microsoft.com/playwright:v1.59.1-noble && exit 0
            echo "Reintento $intento de la descarga de la imagen"; sleep $((intento * 10))
          done
          exit 1

      - name: Aplicar todas las migraciones
        run: node scripts/reproducir-migraciones.mjs

      - name: Sembrar usuario, negocio y catálogo
        run: node scripts/semilla-e2e-local.mjs

      - name: E2E del panel, el circuito y el barrido con datos
        run: |
          docker run --rm --network host --ipc=host \
            -v "$PWD:/w" -w /w \
            -e CI=true -e E2E_REQUIRE_AUTH=true -e E2E_LOCAL=true \
            -e VITE_SUPABASE_URL -e VITE_SUPABASE_PUBLISHABLE_KEY \
            -e E2E_USER -e E2E_PASSWORD -e E2E_STORE_SLUG \
            mcr.microsoft.com/playwright:v1.59.1-noble \
            npx playwright test --project=setup --project=panel --project=circuito --project=barrido-datos --project=alta --project=alta-celular

      # Cada Playwright limpia test-results: la evidencia se sube antes del
      # siguiente, o se pierde (pasó el 2026-11-02: la corrida no dejó nada).
      - name: Evidencia de fallas (panel)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-panel-${{ github.run_attempt }}
          path: test-results/**
          if-no-files-found: ignore

      # Antes del próximo Playwright, que limpia test-results.
      - name: Rendimiento por pantalla
        if: always()
        run: node scripts/resumen-rendimiento.mjs

      # Sólo los specs de la tienda que leen la base real (exigirBackendReal):
      # los sintéticos interceptan *.supabase.co y corren en ci.yml.
      - name: E2E de la tienda pública (escritorio y teléfono)
        if: always()
        run: |
          docker run --rm --network host --ipc=host \
            -v "$PWD:/w" -w /w \
            -e CI=true -e E2E_LOCAL=true \
            -e VITE_SUPABASE_URL -e VITE_SUPABASE_PUBLISHABLE_KEY -e E2E_STORE_SLUG \
            -e E2E_BUYER_EMAIL -e E2E_BUYER_PASSWORD \
            mcr.microsoft.com/playwright:v1.59.1-noble \
            npx playwright test --project=chromium --project=mobile \
              e2e/tienda.spec.ts e2e/tienda-accessibility.spec.ts e2e/store-order.spec.ts e2e/store-read-recovery.spec.ts \
              e2e/checkout-multi-tab.spec.ts e2e/header.spec.ts e2e/pricing.spec.ts e2e/tienda-comprador.spec.ts \
              e2e/rendimiento-tienda.spec.ts

      - name: Rendimiento de la tienda
        if: always()
        run: node scripts/resumen-rendimiento.mjs test-results/rendimiento-tienda.jsonl

      # Cada Playwright limpia test-results: la evidencia se sube antes del
      # siguiente, o se pierde (pasó el 2026-11-02: la corrida no dejó nada).
      - name: Evidencia de fallas (tienda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-tienda-${{ github.run_attempt }}
          path: test-results/**
          if-no-files-found: ignore

      # Al final, porque cambia precios y stock del negocio de prueba.
      - name: E2E a escala (5.500 productos, como Famatina)
        if: always()
        run: |
          node scripts/semilla-escala-local.mjs
          docker run --rm --network host --ipc=host             -v "$PWD:/w" -w /w             -e CI=true -e E2E_REQUIRE_AUTH=true -e E2E_LOCAL=true             -e VITE_SUPABASE_URL -e VITE_SUPABASE_PUBLISHABLE_KEY             -e E2E_USER -e E2E_PASSWORD -e E2E_STORE_SLUG             mcr.microsoft.com/playwright:v1.59.1-noble             npx playwright test --project=setup --project=escala

      - name: Recorrido del primer día en capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorrido-primer-dia-${{ github.run_attempt }}
          path: recorrido/**
          if-no-files-found: ignore

      - name: Evidencia de fallas (escala)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-escala-${{ github.run_attempt }}
          path: test-results/**
          if-no-files-found: ignore

      - name: Detener Supabase
        if: always()
        run: npx supabase stop --no-backup --workdir "$RUNNER_TEMP/vacio"
