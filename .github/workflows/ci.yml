name: CI

on:
  push:
    branches: ["main", "claude/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Types & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Las Edge Functions manejan cobros, webhooks y facturación, pero quedan
      # fuera de tsconfig.app.json porque corren en Deno. Su lista se descubre
      # desde el filesystem: una función nueva no puede escapar del gate.
      - name: Setup Deno for Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      # El mismo plan que npm run verify local: Edge, docs, lint, tipos y build.
      - name: Shared build verification
        run: npm run verify -- --stage=build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-key' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          VITE_TIENDANUBE_APP_ID: ${{ secrets.VITE_TIENDANUBE_APP_ID || '0' }}
          VITE_APP_VERSION: ${{ github.sha }}
          # Source maps a Sentry: solo se suben si estos secrets existen.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Bloqueante: los tests (smoke de páginas + cálculos) deben pasar.
      - name: Run tests
        run: npm run verify -- --stage=test

  e2e:
    name: Critical E2E (store + panel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_STORE_SLUG: ${{ secrets.E2E_STORE_SLUG }}
      E2E_USER: ${{ secrets.E2E_USER }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_REQUIRE_AUTH: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Falla de forma explícita antes de arrancar el browser. Así una variable
      # ausente no se convierte en "Tienda no encontrada" ni en tests del panel
      # salteados que dejan el workflow verde.
      - name: Validate E2E environment
        shell: bash
        run: |
          required=(VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY E2E_STORE_SLUG E2E_USER E2E_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error title=E2E sin configurar::Falta $name en GitHub Actions"
              exit 1
            fi
          done

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Todos son de sólo lectura: tienda en escritorio/teléfono y superficies
      # críticas del panel con una identidad técnica sin MFA ni acceso Platform.
      - name: Run critical E2E
        run: npm run verify -- --stage=e2e

      # Un fallo sin captura ni trace obliga a adivinar el estado real de una
      # sesión remota. La evidencia se conserva sólo cuando hace falta y no
      # incluye el storageState autenticado.
      - name: Preserve E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-e2e-failure-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Bloqueante desde moderate, incluyendo herramientas de build.
      - name: Shared dependency audit
        run: npm run verify -- --stage=security
