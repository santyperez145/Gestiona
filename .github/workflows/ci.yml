name: CI

on:
  push:
    branches: ["main", "claude/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Types & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Las Edge Functions manejan cobros, webhooks y facturación, pero quedan
      # fuera de tsconfig.app.json porque corren en Deno. Su lista se descubre
      # desde el filesystem: una función nueva no puede escapar del gate.
      - name: Setup Deno for Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Type check Edge Functions
        run: npm run check:functions

      # P0-01: la documentación no puede declarar números sin fecha ni comando.
      # Medido el 2026-08-25, había SEIS cantidades distintas de tests (418,
      # 1.201, 1.446, 1.469, 1.498, 1.534) y cuatro de tablas repartidas entre
      # CLAUDE.md, ROADMAP.md y docs/. Este repo es público y sus números se
      # citan afuera: uno externo tomó "418 tests" de una línea vieja.
      - name: Conteos de la documentación
        run: npm run check:conteos

      # Bloqueante: falla el CI ante cualquier ERROR de eslint.
      # Los warnings (deuda de exhaustive-deps) todavía no bloquean.
      - name: Lint
        run: npm run lint

      # OJO: `npx tsc --noEmit` sobre el tsconfig raíz (files: []) NO chequea
      # NINGÚN archivo — daba verde siempre. Por eso pasaron sin detectarse
      # errores que rompían páginas en runtime (ver DialogFooter, settings).
      # `npm run typecheck` apunta a tsconfig.app.json y sí chequea de verdad.
      #
      # BLOQUEANTE desde 2026-07-28: la deuda llegó a 0 (venía de ~810).
      # Mantenerlo así — varios bugs de runtime (columnas inexistentes, upserts
      # sin NOT NULL, firmas mal llamadas) solo se detectaron acá.
      - name: Type check
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-key' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          VITE_TIENDANUBE_APP_ID: ${{ secrets.VITE_TIENDANUBE_APP_ID || '0' }}
          VITE_APP_VERSION: ${{ github.sha }}
          # Source maps a Sentry: solo se suben si estos secrets existen.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Bloqueante: los tests (smoke de páginas + cálculos) deben pasar.
      - name: Run tests
        run: npm test -- --reporter=verbose

  e2e:
    name: Critical E2E (store + panel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_STORE_SLUG: ${{ secrets.E2E_STORE_SLUG }}
      E2E_USER: ${{ secrets.E2E_USER }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_REQUIRE_AUTH: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Falla de forma explícita antes de arrancar el browser. Así una variable
      # ausente no se convierte en "Tienda no encontrada" ni en tests del panel
      # salteados que dejan el workflow verde.
      - name: Validate E2E environment
        shell: bash
        run: |
          required=(VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY E2E_STORE_SLUG E2E_USER E2E_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error title=E2E sin configurar::Falta $name en GitHub Actions"
              exit 1
            fi
          done

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Todos son de sólo lectura: tienda en escritorio/teléfono y superficies
      # críticas del panel con una identidad técnica sin MFA ni acceso Platform.
      - name: Run critical E2E
        run: npm run test:e2e:ci

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # BLOQUEANTE. Solo dependencias de producción (lo que llega al browser) y
      # solo severidad `critical`: es un gate que hoy pasa y que frena de verdad
      # cuando entra algo urgente. Subir a `high` cuando se resuelva `xlsx`.
      - name: Audit (producción, crítico)
        run: npm audit --omit=dev --audit-level=critical

      # Informativo: la foto completa, incluido el tooling de build.
      # Lo que queda son majors de dev (eslint 10, vite 8, @sentry/vite-plugin 5)
      # y `xlsx`, que no tiene fix publicado en npm — SheetJS se distribuye por
      # su propio CDN desde la v0.19. Ver ROADMAP, sesión 84.
      - name: Audit completo (informativo)
        run: npm audit
        continue-on-error: true
