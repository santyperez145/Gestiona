<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <!--
      Red de seguridad del arranque (2026-10-23). Si una pieza de /assets no
      carga (un service worker viejo sirvió un index.html de una versión que ya
      no está publicada), la página quedaba en negro: main.tsx nunca llega a
      correr y su recuperación tampoco. Con conexión, se borran sólo los cachés
      de código (nunca las ventas offline del POS, que viven en IndexedDB) y se
      recarga UNA vez; si vuelve a fallar, se muestra un aviso con un botón.
      main.tsx limpia la marca cuando la app arranca bien.
    -->
    <script>
      (function () {
        var MARCA = "nerqia.recarga-por-version";
        var avisado = false;
        function aviso() {
          if (avisado) return;
          avisado = true;
          var mostrar = function () {
            var raiz = document.getElementById("root");
            if (!raiz || raiz.childElementCount) return;
            raiz.innerHTML = '<div role="alert" style="font-family:system-ui,sans-serif;max-width:28rem;margin:20vh auto;padding:0 16px;text-align:center;color:#18181b">' +
              '<p style="font-size:1.1rem;font-weight:600;margin:0 0 .5rem">Hay una versión nueva de Nerqia</p>' +
              '<p style="margin:0 0 1rem;color:#52525b">No pudimos cargar la anterior. Tocá el botón para abrir la nueva.</p>' +
              '<button type="button" style="font:inherit;padding:.6rem 1.2rem;border-radius:.5rem;border:0;background:#173aef;color:#fff;cursor:pointer">Abrir la versión nueva</button></div>';
            raiz.querySelector("button").addEventListener("click", function () { location.reload(); });
          };
          if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mostrar); else mostrar();
        }
        window.addEventListener("error", function (evento) {
          var origen = evento.target;
          if (!origen || origen === window) return;
          var url = origen.src || origen.href || "";
          if (!/\/assets\/[^?#]+\.(js|css)/.test(url) || navigator.onLine === false) return;
          try {
            if (sessionStorage.getItem(MARCA)) { aviso(); return; }
            sessionStorage.setItem(MARCA, "1");
          } catch (e) { aviso(); return; }
          var tareas = [];
          if (navigator.serviceWorker) tareas.push(navigator.serviceWorker.getRegistrations().then(function (registros) {
            return Promise.all(registros.map(function (r) { return r.unregister(); }));
          }));
          if (window.caches) tareas.push(caches.keys().then(function (nombres) {
            return Promise.all(nombres.filter(function (n) { return /workbox-precache|app-chunks/.test(n); }).map(function (n) { return caches.delete(n); }));
          }));
          Promise.all(tareas).catch(function () {}).then(function () { location.reload(); });
        }, true);
      })();
    </script>
    <title>Nerqia | Tienda online con gestión y finanzas conectadas</title>
    <meta name="description" content="Creá tu tienda online y conectá pedidos, stock, clientes, pagos, costos, caja y margen real en una sola plataforma para comercios argentinos." />

  <body>
    <!--
      Pantalla de arranque (2026-11-01): la misma que AppLoader, dibujada antes
      de que llegue JavaScript, así entrar al panel es una sola pantalla quieta
      y no un blanco seguido de varios cargadores. Sólo para el panel con
      sesión: en una tienda (o su dominio propio), la landing o una página
      pública no se muestra nunca la marca Nerqia. React la reemplaza al montar.
    -->
    <div id="root"></div>
    <!-- En un <template> no es parte de la página (ni de su texto) hasta que el
         script lo clona: el HTML de una tienda no lleva la marca Nerqia. -->
    <template id="plantilla-arranque"><div id="arranque" class="app-boot-shell min-h-screen flex items-center justify-center" role="status" aria-live="polite">
      <div class="text-center px-6">
        <span class="brand-logo inline-flex min-w-0 items-center gap-2.5 justify-center mb-5" aria-hidden="true">
          <img src="/brand/nerqia-mark-64.webp" srcset="/brand/nerqia-mark-64.webp 64w, /brand/nerqia-mark-128.webp 128w" sizes="40px" alt="" width="128" height="128" class="brand-logo__mark h-10 w-10 shrink-0 object-contain" />
          <span class="brand-logo__name truncate font-display font-semibold tracking-tight text-lg">Nerqia</span>
        </span>
        <div class="w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
        <p class="text-muted-foreground text-sm font-medium tracking-tight">Cargando Nerqia...</p>
      </div>
    </div></template>
    <!-- La landing en HTML (2026-11-02): el build la renderiza acá
         (scripts/landing-previa.mjs). Se muestra en «/» sin sesión mientras
         baja el JavaScript y se saca cuando React monta la misma landing. -->
    <template id="plantilla-landing"><!--landing-previa--></template>
    <script>
      (function () {
        try {
          var tema = localStorage.getItem("gestiona-theme");
          var oscuro = tema === "dark" || (tema === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(oscuro ? "dark" : "light");
          var host = location.hostname;
          // Sólo el panel: un subdominio (comercio.nerqia.app) es la tienda del comercio.
          var deNerqia = host === "nerqia.app" || host === "www.nerqia.app" || host === "localhost" || host === "127.0.0.1" || /\.vercel\.app$/.test(host);
          var publica = /^\/(tienda|pagar|catalogo|influencer|invitacion|invitacion-creador|aceptar-contrato)\//.test(location.pathname)
            || /^\/(precios|terminos|privacidad|estado|login)\/?$/.test(location.pathname);
          var conSesion = false;
          for (var i = 0; i < localStorage.length; i++) {
            if (/^sb-.+-auth-token$/.test(localStorage.key(i) || "")) { conSesion = true; break; }
          }
          var raiz = document.getElementById("root");
          if (deNerqia && !publica && conSesion) {
            var plantilla = document.getElementById("plantilla-arranque");
            raiz.appendChild(plantilla.content.cloneNode(true));
          }
          var landing = document.getElementById("plantilla-landing");
          if (deNerqia && !conSesion && location.pathname === "/" && landing.content.childElementCount) {
            var previa = document.createElement("div");
            previa.id = "landing-previa";
            previa.appendChild(landing.content.cloneNode(true));
            raiz.parentNode.insertBefore(previa, raiz);
            // React arranca debajo, oculto; el cargador no se ve. Se cambia en
            // el mismo cuadro en que monta la landing viva (el observador corre
            // antes de pintar) o cualquier otra pantalla que no sea un cargador.
            raiz.style.display = "none";
            // Un toque a un botón de la previa (el menú, una pestaña) todavía
            // no tiene React: se recuerda cuál era y se repite en la viva.
            var tocado = -1;
            previa.addEventListener("click", function (evento) {
              var boton = evento.target.closest && evento.target.closest("button");
              if (boton) tocado = Array.prototype.indexOf.call(previa.querySelectorAll("button"), boton);
            });
            var observador = new MutationObserver(function () {
              var viva = raiz.querySelector("[data-landing]");
              var cargando = raiz.querySelector(".app-boot-shell, .animate-spin");
              if (!viva && (cargando || !raiz.firstElementChild)) return;
              observador.disconnect();
              previa.remove();
              raiz.style.display = "";
              var boton = viva && tocado >= 0 ? viva.querySelectorAll("button")[tocado] : null;
              if (boton) setTimeout(function () { boton.click(); }, 0);
            });
            observador.observe(raiz, { childList: true, subtree: true });
          }
        } catch (e) { /* sin almacenamiento: arranca como siempre */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
